name: fluito
description: Fluito — a Christian Pentecostal dating app. Flutter client for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf

flutter_native_splash:
  color: "#E8F4FF"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#E8F4FF"
    image: assets/branding/splash_logo.png
    icon_background_color: "#E8F4FF"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 24
